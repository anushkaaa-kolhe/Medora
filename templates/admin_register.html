<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Sign Up - Medora</title>
</head>
<body>
  <h1>Admin Sign Up</h1>

  {% for message in get_flashed_messages() %}
    <p>{{ message }}</p>
  {% endfor %}

  <form method="POST">
    <p><label>Name <input type="text" name="name" required></label></p>
    <p><label>Email <input type="email" name="email" required></label></p>
    <p><label>Phone <input type="tel" name="phone"></label></p>
    <p><label>Password (min 8 characters) <input type="password" name="password" required></label></p>
    <button type="submit">Create account</button>
  </form>

  <p>Already registered? <a href="{{ url_for('admin_login') }}">Log in</a></p>
</body>
</html>
