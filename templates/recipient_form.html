{% extends "base.html" %}
{% block title %}Add Recipient{% endblock %}
{% block content %}
  <h1>Add Recipient</h1>
  <form method="POST">
    <label>Name <input type="text" name="name" required></label>
    <label>Phone (10 digits) <input type="tel" name="phone" required></label>
    <label>Email (optional) <input type="email" name="email"></label>
    <label>Age <input type="number" name="age" min="1" max="120"></label>
    <label>Preferred language
      <select name="preferred_language">
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="mr">Marathi</option>
      </select>
    </label>
    <label>Emergency contact phone <input type="tel" name="emergency_contact_phone"></label>
    <button type="submit">Save recipient</button>
  </form>
  <p><a href="{{ url_for('recipient_list') }}">Cancel</a></p>
{% endblock %}
