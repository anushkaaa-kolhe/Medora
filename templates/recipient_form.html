<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Recipient - Medora</title>
</head>
<body>
  <h1>Add Recipient</h1>

  {% for message in get_flashed_messages() %}
    <p>{{ message }}</p>
  {% endfor %}

  <form method="POST">
    <p><label>Name <input type="text" name="name" required></label></p>
    <p><label>Phone (10 digits) <input type="tel" name="phone" required></label></p>
    <p><label>Email (optional) <input type="email" name="email"></label></p>
    <p><label>Age <input type="number" name="age" min="1" max="120"></label></p>
    <p>
      <label>Preferred language
        <select name="preferred_language">
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="mr">Marathi</option>
        </select>
      </label>
    </p>
    <p><label>Emergency contact phone <input type="tel" name="emergency_contact_phone"></label></p>
    <button type="submit">Save recipient</button>
  </form>

  <p><a href="{{ url_for('recipient_list') }}">Cancel</a></p>
</body>
</html>
