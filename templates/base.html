<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Medora{% endblock %} - Medora</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a href="{{ url_for('home') }}">
      <img class="logo" src="{{ url_for('static', filename='images/Medora_Logo1.png') }}" alt="Medora logo">
    </a>
    {% if session.get('admin_id') %}
      <nav class="nav">
        <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('recipient_list') }}">Recipients</a>
        <a href="{{ url_for('admin_logout') }}">Log out</a>
      </nav>
    {% endif %}
  </header>

  <main class="page">
    {% for message in get_flashed_messages() %}
      <div class="flash">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    Medora sends reminders and records doses. It does not give medical advice
    and is not a substitute for your doctor.
  </footer>
</body>
</html>
