<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Medora</title>
</head>
<body>
  <h1>Welcome, {{ admin.name }}</h1>
  <p>You are logged in as an admin.</p>

  {% for message in get_flashed_messages() %}
    <p>{{ message }}</p>
  {% endfor %}

  <p><a href="{{ url_for('recipient_list') }}">Manage recipients</a></p>
  <p><a href="{{ url_for('admin_logout') }}">Log out</a></p>
</body>
</html>
