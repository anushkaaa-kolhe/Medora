{% extends "base.html" %}
{% block title %}Add Medicine{% endblock %}
{% block content %}
  <h1>Add medicine for {{ recipient.name }}</h1>

  <form method="POST">
    <label>Medicine name <input type="text" name="name" required></label>
    <label>Strength (e.g. 500 mg) <input type="text" name="strength"></label>
    <label>What is it for? <input type="text" name="description"></label>
    <label>Doctor's note <input type="text" name="prescription_note"></label>
    <label>Take
      <select name="with_food">
        <option value="any">Any time</option>
        <option value="before">Before food</option>
        <option value="after">After food</option>
      </select>
    </label>
    <label>Tablets in stock <input type="number" name="stock_count" min="0"></label>

    <hr>
    <h3>Schedule</h3>

    <label>Times per day
      <select id="times_per_day">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </label>

    {% for i in range(4) %}
      <label class="time-row">Dose time {{ i + 1 }} <input type="time" name="times"></label>
    {% endfor %}

    <label>Repeat
      <select name="repeat_type" id="repeat_type">
        <option value="daily">Every day</option>
        <option value="weekly">Specific days of the week</option>
        <option value="once">Only once</option>
      </select>
    </label>

    <p id="days-row" style="display:none;">
      Days:
      <label style="display:inline;"><input type="checkbox" name="days" value="0"> Mon</label>
      <label style="display:inline;"><input type="checkbox" name="days" value="1"> Tue</label>
      <label style="display:inline;"><input type="checkbox" name="days" value="2"> Wed</label>
      <label style="display:inline;"><input type="checkbox" name="days" value="3"> Thu</label>
      <label style="display:inline;"><input type="checkbox" name="days" value="4"> Fri</label>
      <label style="display:inline;"><input type="checkbox" name="days" value="5"> Sat</label>
      <label style="display:inline;"><input type="checkbox" name="days" value="6"> Sun</label>
    </p>

    <label>Start date <input type="date" name="start_date" value="{{ today }}"></label>
    <label id="end-row">End date (optional) <input type="date" name="end_date"></label>

    <button type="submit">Save medicine</button>
  </form>

  <p><a href="{{ url_for('medicine_list', recipient_id=recipient.id) }}">Cancel</a></p>

  <script>
    const timesSelect = document.getElementById("times_per_day");
    const timeRows = document.querySelectorAll(".time-row");
    const repeatSelect = document.getElementById("repeat_type");
    const daysRow = document.getElementById("days-row");
    const endRow = document.getElementById("end-row");

    function updateTimes() {
      const n = parseInt(timesSelect.value, 10);
      timeRows.forEach(function (row, i) {
        const show = i < n;
        row.style.display = show ? "" : "none";
        row.querySelector("input").disabled = !show;
      });
    }

    function updateRepeat() {
      const v = repeatSelect.value;
      daysRow.style.display = (v === "weekly") ? "" : "none";
      endRow.style.display = (v === "once") ? "none" : "";
    }

    timesSelect.addEventListener("change", updateTimes);
    repeatSelect.addEventListener("change", updateRepeat);
    updateTimes();
    updateRepeat();
  </script>
{% endblock %}
